name: Build HealthMi sleep compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sleep-compatibility.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Prepare compatibility regression check
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('sleep_api_check.swift').write_bytes(base64.b64decode(''))
          Path('patch_sleep_api.py').write_bytes(base64.b64decode(''))
      - name: Verify failing regression before repair
        shell: bash
        run: |
          set -euo pipefail
          cp HealthMi/MiFitness/MiAPIClient.swift "$RUNNER_TEMP/MiAPIClient-original.swift"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('HealthMi/MiFitness/MiAPIClient.swift').read_text()
          source = source.replace('config.httpCookieStorage = nil', 'config.protocolClasses = [FixtureProtocol.self]; config.httpCookieStorage = nil')
          Path('api-test.swift').write_text(source)
          PY
          xcrun swiftc -swift-version 5 -parse-as-library api-test.swift HealthMi/MiFitness/MiCrypto.swift HealthMi/MiFitness/MiModels.swift HealthMi/MiFitness/MiRegion.swift HealthMi/Support/AppLog.swift sleep_api_check.swift -o "$RUNNER_TEMP/check-sleep"
          if "$RUNNER_TEMP/check-sleep" > "$RUNNER_TEMP/baseline.log" 2>&1; then
            echo 'Expected regression failure was not reproduced'
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q 'FAIL: empty legacy response must retry compatible GET' "$RUNNER_TEMP/baseline.log"
      - name: Apply repair and pass regression
        shell: bash
        run: |
          set -euo pipefail
          python3 patch_sleep_api.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('HealthMi/MiFitness/MiAPIClient.swift').read_text()
          source = source.replace('config.httpCookieStorage = nil', 'config.protocolClasses = [FixtureProtocol.self]; config.httpCookieStorage = nil')
          Path('api-test.swift').write_text(source)
          PY
          xcrun swiftc -swift-version 5 -parse-as-library api-test.swift HealthMi/MiFitness/MiCrypto.swift HealthMi/MiFitness/MiModels.swift HealthMi/MiFitness/MiRegion.swift HealthMi/Support/AppLog.swift sleep_api_check.swift -o "$RUNNER_TEMP/check-sleep"
          "$RUNNER_TEMP/check-sleep"
          git diff --check
      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project HealthMi.xcodeproj -target HealthMi -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/healthmi-build" build > "$RUNNER_TEMP/sleep-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/sleep-build.log"; exit 1; }
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/healthmi-build/HealthMi.app"
          plutil -lint "$APP/Info.plist"
          lipo "$APP/HealthMi" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/HealthMi.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$GITHUB_WORKSPACE/dist/HealthMi-sleep-compatible.ipa" Payload)
          unzip -t dist/HealthMi-sleep-compatible.ipa
          shasum -a 256 dist/HealthMi-sleep-compatible.ipa > dist/SHA256SUMS.txt
          git diff > dist/sleep-compatibility.patch
          cp sleep_api_check.swift patch_sleep_api.py dist/
      - uses: actions/upload-artifact@v7
        with:
          name: HealthMi-sleep-compatible
          path: dist/
          if-no-files-found: error
